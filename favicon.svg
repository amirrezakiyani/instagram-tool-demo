<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<defs>
 <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5eaa"/><stop offset=".2" stop-color="#ffb45e"/><stop offset=".38" stop-color="#fff078"/><stop offset=".55" stop-color="#63efb7"/><stop offset=".72" stop-color="#54dcff"/><stop offset=".86" stop-color="#8b7cff"/><stop offset="1" stop-color="#ed79df"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="5" y="5" width="118" height="118" rx="32" fill="#0b0d22" stroke="#ffffff" stroke-opacity=".3" stroke-width="2"/>
<g transform="translate(64 64)">
 <circle r="45" fill="none" stroke="url(#rainbow)" stroke-width="5" stroke-linecap="round" stroke-dasharray="45 18 20 18" filter="url(#glow)">
  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
 </circle>
 <g>
  <rect x="-27" y="-31" width="54" height="62" rx="16" fill="url(#rainbow)" stroke="#ffffff" stroke-opacity=".85" stroke-width="2"/>
  <path d="M0 -17 V13 M-12 2 L0 15 L12 2" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <animateTransform attributeName="transform" type="translate" values="0 -2;0 2;0 -2" dur="2.4s" repeatCount="indefinite"/>
 </g>
</g>
<circle cx="24" cy="29" r="3" fill="#fff078"><animate attributeName="opacity" values=".3;1;.3" dur="1.7s" repeatCount="indefinite"/></circle>
<circle cx="105" cy="99" r="4" fill="#54dcff"><animate attributeName="opacity" values="1;.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
</svg>